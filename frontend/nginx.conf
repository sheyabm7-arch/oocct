# nginx config for the React (Vite) single-page application
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # ---- React Router: send every unknown route back to index.html ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- Proxy REST API calls to the Spring Boot backend ----
    # "backend" is the service name (e.g. in docker-compose); change if needed.
    location /api/ {
        proxy_pass         http://backend:9000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ---- Proxy the WebSocket (STOMP/SockJS) endpoint for real-time chat ----
    location /ws/ {
        proxy_pass          http://backend:9000;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_set_header    Host       $host;
    }

    # Cache static assets aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
