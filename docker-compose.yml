# ============================================================
#  OCT Analysis Platform — full stack
# ============================================================

services:
  # PostgreSQL 16 database
  postgres:
    image: postgres:16-alpine
    container_name: oct-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oct-network

  # Backend — Spring Boot
  backend:
    build: ./backend/backend
    image: abomazen0/oct-backend:latest
    container_name: oct-backend
    restart: unless-stopped
    ports:
      - "9000:9000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    networks:
      - oct-network

  # AI Engine — FastAPI
  ai-service:
    build: ./ai-service
    image: abomazen0/oct-ai:latest
    container_name: oct-ai-service
    restart: unless-stopped
    ports:
      - "8001:8001"
    networks:
      - oct-network

  # Frontend — React/nginx
  frontend:
    build: ./frontend
    image: abomazen0/oct-frontend:latest
    container_name: oct-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
      - ai-service
    networks:
      - oct-network

networks:
  oct-network:
    driver: bridge

volumes:
  postgres_data: