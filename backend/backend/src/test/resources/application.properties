# ── Test profile ──
# Used automatically when running `mvn test`. Overrides the real datasource
# with an in-memory H2 database so the Spring context can load in CI without
# a running PostgreSQL server.

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Dummy values so beans that read these properties can initialize
jwt.secret=test-secret-key-for-ci-only-not-used-in-production-1234567890
gemini.api.key=test
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@test.com
spring.mail.password=test
