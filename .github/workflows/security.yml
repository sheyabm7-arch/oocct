# ============================================================
#  Security — secret scanning
#  Runs on every push to main.
#
#  Note: CodeQL (SAST) was removed because it requires GitHub
#  Advanced Security, which is not available on private
#  repositories without a paid license. If this repo is made
#  public, the CodeQL job can be re-added.
# ============================================================
name: Security

on:
  push:
    branches: [main]

jobs:
  # ----------------------------------------------------------
  # Scan the repository for accidentally committed secrets
  # (API keys, passwords, tokens) using TruffleHog.
  # ----------------------------------------------------------
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history so TruffleHog can scan all commits

      - name: Run TruffleHog secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          # The action already fails the build on findings; only add filtering here.
          # (Do NOT pass --fail — the action adds it internally and it can't repeat.)
          extra_args: --only-verified
