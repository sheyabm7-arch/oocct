# ============================================================
#  Build & Push — build the 3 Docker images and push to Docker Hub
#  Runs ONLY after the "CI" workflow completes successfully on main.
# ============================================================
name: Build and Push

on:
  workflow_run:
    workflows: ["CI"]          # must match the name: of ci.yml
    types: [completed]
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Only run if the CI workflow that triggered this finished successfully
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Enables advanced Docker build features (multi-stage caching, etc.)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in to Docker Hub using repository secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ---- Backend image (Dockerfile is in backend/backend) ----
      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend/backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/oct-backend:latest

      # ---- Frontend image ----
      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/oct-frontend:latest

      # ---- AI Engine image ----
      - name: Build & push ai-service
        uses: docker/build-push-action@v6
        with:
          context: ./ai-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/oct-ai:latest
